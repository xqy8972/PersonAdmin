<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8effa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>个人管理系统</title>
<link rel="stylesheet" href="https://unpkg.com/element-plus@2.8.4/dist/index.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body, #app { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro SC", "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    background: linear-gradient(150deg, #e8effa 0%, #dce9f8 45%, #eef4fc 100%);
    background-attachment: fixed;
  }

  .layout { display: flex; height: 100%; }

  /* 渠道同步来源徽标：投资名称后的浅蓝色小框 */
  .src-badge {
    display: inline-block;
    margin-left: 6px;
    padding: 0 5px;
    font-size: 11px;
    line-height: 18px;
    color: #3a8ee6;
    background: #e8f4fd;
    border: 1px solid #b3d8f5;
    border-radius: 3px;
    vertical-align: 1px;
  }

  /* 盘中实时行情徽标：最新价旁的绿色呼吸点小框 */
  .live-badge {
    display: inline-block;
    margin-left: 6px;
    padding: 0 5px;
    font-size: 11px;
    line-height: 18px;
    color: #34c759;
    background: #eafaf0;
    border: 1px solid #b3e6c5;
    border-radius: 3px;
    vertical-align: 1px;
  }

  /* ===== 左侧栏：macOS 毛玻璃 ===== */
  .aside {
    width: 230px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    background: rgba(250, 250, 252, 0.6);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    backdrop-filter: blur(28px) saturate(180%);
    border-right: 1px solid rgba(0, 0, 0, 0.06);
  }
  .logo {
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #1d1d1f;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .aside .el-menu {
    border-right: none;
    background: transparent;
    flex: 1;
    padding: 14px 8px 8px;
  }
  /* 菜单项：Apple 圆角胶囊 */
  .aside .el-menu-item,
  .aside .el-sub-menu__title {
    color: rgba(60, 60, 67, 0.85) !important;
    height: 42px;
    line-height: 42px;
    border-radius: 10px;
    margin: 3px 4px;
    font-size: 14px;
  }
  .aside .el-menu-item:hover,
  .aside .el-sub-menu__title:hover {
    background: rgba(0, 0, 0, 0.05) !important;
    color: #1d1d1f !important;
  }
  /* 选中态：浅灰圆角 */
  .aside .el-menu-item.is-active {
    background: rgba(0, 0, 0, 0.07) !important;
    color: #1d1d1f !important;
    font-weight: 600;
  }
  .aside .el-sub-menu.is-active > .el-sub-menu__title { color: #1d1d1f !important; }
  .aside .el-menu--inline { background: transparent !important; }

  /* ===== 顶栏同款毛玻璃 ===== */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .header {
    height: 60px;
    background: rgba(250, 250, 252, 0.6);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    backdrop-filter: blur(28px) saturate(180%);
    border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    display: flex;
    align-items: center;
    padding: 0 24px;
    font-size: 16px;
    font-weight: 600;
    color: #1d1d1f;
  }
  .content { flex: 1; padding: 20px; overflow-y: auto; }

  /* 等高图表卡片：卡片体填满，图表区占满剩余空间 */
  .chart-card { display: flex; flex-direction: column; }
  .chart-card > .el-card__body { flex: 1; display: flex; flex-direction: column; min-height: 0; }

  .toolbar { display: flex; gap: 12px; margin-bottom: 16px; }
  .stat-card { margin-bottom: 8px; }
  .stat-title { color: #909399; font-size: 13px; }
  .stat-value { font-size: 26px; font-weight: bold; margin: 8px 0; color: #303133; }
  .stat-desc { color: #c0c4cc; font-size: 12px; }
  /* A 股配色：红=收入/收益，绿=支出/亏损（类名保留，颜色已互换） */
  .green { color: #f56c6c; } .red { color: #67c23a; } .blue { color: #409eff; }
  .banner {
    background: linear-gradient(135deg, #dbe7fb 0%, #e7e0fa 60%, #f3e6f0 100%);
    border-radius: 14px;
    padding: 26px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    border: 1px solid rgba(255, 255, 255, 0.7);
    box-shadow: 0 2px 12px rgba(80, 100, 160, 0.08);
  }
  .banner-greet { font-size: 22px; font-weight: 700; color: #1d1d1f; }
  .banner-date { font-size: 13px; color: #6e6e73; margin-top: 6px; }
  .banner-balance { text-align: right; }
  .banner-balance-label { font-size: 13px; color: #6e6e73; }
  .banner-balance-value { font-size: 30px; font-weight: 700; margin-top: 4px; }
  .login-wrap { height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-box {
    width: 380px;
    background: rgba(255, 255, 255, 0.78);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    backdrop-filter: blur(28px) saturate(180%);
    border-radius: 18px;
    padding: 40px 36px 32px;
    box-shadow: 0 12px 40px rgba(80, 100, 160, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.7);
  }
  .login-logo { font-size: 22px; font-weight: 700; color: #1d1d1f; text-align: center; letter-spacing: 1px; }
  .login-sub { font-size: 13px; color: #86868b; text-align: center; margin: 8px 0 26px; }
  .login-toggle { margin-top: 18px; text-align: center; font-size: 13px; color: #6e6e73; }
  .login-toggle a { color: #007aff; cursor: pointer; }

  .stat-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .recent-row { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid #f2f2f4; font-size: 14px; }
  .recent-row:last-child { border-bottom: none; }
  .recent-date { color: #86868b; width: 100px; }
  .recent-cat { color: #3a3a3c; }

  .placeholder { height: 260px; display: flex; align-items: center; justify-content: center; color: #c0c4cc; }

  /* ===== 移动端 m-* 质感组件（媒体查询外定义，桌面访问移动路由也能看） ===== */
  .m-wrap { max-width: 620px; margin: 0 auto; padding: 4px 2px 8px; }
  .m-hero { background: linear-gradient(135deg, #4a90d9 0%, #2f6fce 55%, #2a5cb8 100%); border-radius: 18px; padding: 22px 20px 16px; color: #fff; box-shadow: 0 10px 26px rgba(47, 111, 206, .35); margin-bottom: 14px; }
  .m-hero-label { font-size: 13px; opacity: .82; }
  .m-hero-value { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 4px 0 2px; letter-spacing: .5px; }
  .m-hero-sub { display: flex; margin-top: 16px; border-top: 1px solid rgba(255, 255, 255, .22); padding-top: 12px; font-size: 12px; opacity: .85; }
  .m-hero-item { flex: 1; }
  .m-hero-item + .m-hero-item { border-left: 1px solid rgba(255, 255, 255, .22); padding-left: 14px; }
  .m-hero-item b { display: block; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .m-hero-date { font-size: 12px; opacity: .78; margin-top: 10px; }

  .m-sec { background: #fff; border-radius: 16px; box-shadow: 0 4px 16px rgba(80, 100, 160, .08); padding: 16px 16px 8px; margin-bottom: 12px; }
  .m-sec-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .m-sec-icon { width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; }
  .m-sec-title { font-size: 16px; font-weight: 600; color: #1d1d1f; }
  .m-sec-more { margin-left: auto; font-size: 13px; color: #2f6fce; display: flex; align-items: center; gap: 2px; cursor: pointer; }
  .m-kv { display: flex; padding: 4px 0 10px; }
  .m-kv-item { flex: 1; }
  .m-kv-item .m-k { font-size: 12px; color: #86868b; }
  .m-kv-item .m-v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .m-kv-item .m-v.up { color: #d4380d; }
  .m-kv-item .m-v.down { color: #389e0d; }
  .m-kv-actions { display: flex; gap: 10px; padding-bottom: 8px; }

  .m-line { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid #f4f5f7; }
  .m-line:last-child { border-bottom: none; }
  .m-line-main { flex: 1; min-width: 0; }
  .m-line-name { font-size: 14.5px; font-weight: 500; color: #1d1d1f; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .m-line-sub { font-size: 12px; color: #86868b; margin-top: 3px; }
  .m-line-num { text-align: right; font-variant-numeric: tabular-nums; }
  .m-line-num .amt { font-size: 15px; font-weight: 600; color: #1d1d1f; }
  .m-line-num .chg { font-size: 12px; margin-top: 2px; }
  .m-line-num .chg.up { color: #d4380d; }
  .m-line-num .chg.down { color: #389e0d; }
  .m-badge { font-size: 10px; padding: 1px 6px; border-radius: 4px; background: #e8f1fc; color: #2f6fce; font-weight: 500; }
  .m-badge.live { background: #fde3e3; color: #d4380d; }
  .m-empty { color: #b0b4bb; font-size: 13px; padding: 14px 0; text-align: center; }
  .m-link { display: flex; align-items: center; gap: 10px; padding: 13px 16px; background: #fff; border-radius: 16px; box-shadow: 0 4px 16px rgba(80, 100, 160, .08); margin-bottom: 12px; font-size: 14.5px; font-weight: 500; color: #1d1d1f; cursor: pointer; }
  .inv-cards { display: none; }
  .mob-assets { display: none; }

  /* ===== 移动端区间胶囊 + 滑轮日期弹层 ===== */
  .rp-pills { display: none; flex-wrap: nowrap; gap: 8px; }
  .rp-pill { padding: 5px 14px; border-radius: 999px; background: #f2f3f5; color: #6e6e73; font-size: 13px; cursor: pointer; user-select: none; }
  .rp-pill.on { background: #2f6fce; color: #fff; font-weight: 600; }
  .wr-mask { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, .45); z-index: 300; display: flex; align-items: flex-end; justify-content: center; }
  .wr-sheet { background: #fff; width: 100%; max-width: 480px; border-radius: 18px 18px 0 0; padding: 14px 18px calc(18px + env(safe-area-inset-bottom)); animation: wrUp .22s ease; }
  @keyframes wrUp { from { transform: translateY(40%); opacity: .5; } to { transform: none; opacity: 1; } }
  .wr-head { display: flex; justify-content: space-between; align-items: center; font-size: 15px; color: #1d1d1f; }
  .wr-cancel { color: #86868b; padding: 4px 6px; }
  .wr-ok { color: #2f6fce; font-weight: 600; padding: 4px 6px; }
  .wr-title { text-align: center; font-size: 16px; font-weight: 600; color: #1d1d1f; padding: 12px 0 8px; font-variant-numeric: tabular-nums; }
  .wr-title i { font-style: normal; color: #86868b; font-weight: 400; margin: 0 8px; font-size: 13px; }
  .wr-group { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
  .wr-label { width: 34px; font-size: 12px; color: #86868b; flex-shrink: 0; }
  .wr-wheels { flex: 1; display: flex; position: relative; height: 180px; }
  /* 滚轮中间高亮带（居中行 = 上下各 2 行，72px 起 36 高） */
  .wr-wheels::before { content: ''; position: absolute; left: 0; right: 0; top: 72px; height: 36px; background: rgba(47, 111, 206, .08); border-radius: 8px; }
  .wr-wheels::after { content: ''; position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none; background: linear-gradient(180deg, #fff 0%, rgba(255, 255, 255, 0) 30%, rgba(255, 255, 255, 0) 70%, #fff 100%); }
  .wr-wheel { flex: 1; height: 180px; overflow-y: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; position: relative; z-index: 1; }
  .wr-wheel::-webkit-scrollbar { display: none; }
  .wr-item { height: 36px; line-height: 36px; text-align: center; font-size: 16px; color: #1d1d1f; user-select: none; }

  /* ===== 移动端适配（≤768px）：底部 Tab 栏、栅格纵向堆叠、卡片质感覆盖 ===== */
  .m-tabbar { display: none; }
  @media (max-width: 768px) {
    .aside { display: none; }
    .header { padding: 0 12px; font-size: 15px; }
    .header-header-nickname, .header .header-nickname { display: none; }
    .content { padding: 12px 12px 84px; }
    .banner { flex-direction: column; align-items: flex-start; gap: 8px; padding: 18px; }
    .banner-balance { text-align: left; }
    .banner-balance-value { font-size: 24px; }
    /* 栅格列全部堆叠为整行（el-col 宽度是内联样式，需 !important 覆盖） */
    .el-row > .el-col { max-width: 100% !important; flex: 0 0 100% !important; }
    /* 横向图表排布（投资页三图、展开行两图、资产页饼图+趋势）纵向堆叠，高度由图表自身固定内高决定 */
    .mob-row { flex-direction: column !important; height: auto !important; }
    .mob-row > div { width: 100% !important; flex: none !important; height: auto !important; margin-bottom: 12px; }
    .toolbar { flex-wrap: wrap; }
    .el-dialog { width: 94vw !important; }
    .login-box { width: 100%; max-width: 380px; padding: 30px 22px 24px; }
    /* 卡片质感覆盖：去默认边框、圆角 + 轻投影 */
    .el-card { border: none; border-radius: 16px; box-shadow: 0 4px 16px rgba(80, 100, 160, .08); }
    .el-card__header { padding: 14px 16px 8px; border-bottom: none; }
    .el-card__body { padding: 8px 16px 14px; }
    /* 底部 Tab 栏（财务/身体） */
    .m-tabbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 100; background: rgba(255, 255, 255, .96); backdrop-filter: blur(12px); border-top: 1px solid #eceef2; padding-bottom: env(safe-area-inset-bottom); }
    .m-tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 0 7px; font-size: 11px; color: #8e8e93; cursor: pointer; }
    .m-tab.active { color: #2f6fce; font-weight: 600; }
    /* 投资列表：移动端卡片式，免横向滑动，信息一屏展示 */
    .inv-cards { display: flex; flex-direction: column; gap: 12px; }
    .inv-card { background: #fff; border-radius: 16px; box-shadow: 0 4px 16px rgba(80, 100, 160, .08); padding: 14px 16px; }
    .inv-card-head { display: flex; justify-content: space-between; align-items: flex-start; cursor: pointer; }
    .inv-card-name { font-size: 15.5px; font-weight: 600; color: #1d1d1f; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .inv-type { font-size: 10px; padding: 1px 6px; border-radius: 4px; background: #f2f3f5; color: #6e6e73; font-weight: 500; }
    .inv-card-sub { font-size: 12px; color: #86868b; margin-top: 4px; }
    .inv-card-num { text-align: right; flex-shrink: 0; }
    .inv-card-num .amt { font-size: 17px; font-weight: 700; color: #1d1d1f; font-variant-numeric: tabular-nums; }
    .inv-card-num .chg { font-size: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .inv-card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; margin-top: 12px; padding-top: 10px; border-top: 1px solid #f4f5f7; }
    .inv-card-grid > div { display: flex; justify-content: space-between; align-items: baseline; font-size: 12.5px; }
    .inv-card-grid label { color: #86868b; flex-shrink: 0; }
    .inv-card-grid b { font-weight: 600; color: #1d1d1f; font-variant-numeric: tabular-nums; }
    .inv-card-remark { margin-top: 8px; font-size: 12px; color: #a8abb2; }
    .inv-card-ops { display: flex; gap: 8px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
    .inv-card-tip { color: #a8abb2; font-size: 12px; flex: 1; }
    .inv-card-ops .el-button + .el-button { margin-left: 0; }
    .inv-card-charts { margin-top: 12px; display: flex; flex-direction: column; gap: 12px; }
    /* 图表：移动端图大标尺小；区间改胶囊，桌面月选择器隐藏 */
    .rp-pills { display: flex; gap: 5px; }
    /* 一行放不下就缩小字体，保证胶囊不换行 */
    .rp-pill { padding: 3px 9px; font-size: 11.5px; flex-shrink: 0; }
    /* 日期框根元素命中 .el-range-editor.el-input__wrapper（优先级 0,3,0），普通类压不过，必须 !important */
    .desk-range.el-range-editor, .desk-range { display: none !important; }
    /* 健康页图表：单选区间一行不换行 + 移动端压扁 */
    .mob-pills { flex-wrap: nowrap !important; }
    .mob-pills .el-radio-button__inner { padding: 4px 9px; font-size: 12px; }
    .m-chart { height: 200px !important; }
    /* 资产页：桌面表格与移动端列表互斥 */
    .desk-tbl { display: none; }
    .mob-assets { display: block; }
    .chart-canvas { min-height: 200px !important; }
    /* 投资页：移动端隐藏渠道同步按钮 */
    .desk-only { display: none !important; }
    /* 收支详情页：收入/支出切换页签 */
    .m-month-tabs { display: flex; gap: 4px; background: #f2f3f5; border-radius: 999px; padding: 3px; }
    .m-month-tab { padding: 4px 16px; border-radius: 999px; font-size: 13px; color: #6e6e73; cursor: pointer; user-select: none; }
    .m-month-tab.on { background: #fff; color: #2f6fce; font-weight: 600; box-shadow: 0 1px 4px rgba(0, 0, 0, .08); }
    .m-month-total { display: flex; justify-content: flex-end; align-items: baseline; gap: 6px; padding: 10px 0 0; font-size: 13px; color: #86868b; border-top: 1px solid #f4f5f7; margin-top: 6px; }
    /* 投资页顶部图表卡（含饼图）在移动端堆叠时有明确高度，避免 flex:1 塌陷成 0 */
    .mob-row > .chart-card { min-height: 320px; }
  }
</style>

<body>
<div id="app"></div>
<script src="https://unpkg.com/vue@3.4.38/dist/vue.global.js"></script>
<script src="https://unpkg.com/element-plus@2.8.4/dist/index.full.js"></script>
<script src="https://unpkg.com/@element-plus/icons-vue@2.3.1/dist/index.iife.js"></script>
<script src="https://unpkg.com/echarts@5.5.1/dist/echarts.min.js"></script>
<script>
const { createApp, ref, reactive, computed, watch, onMounted, onBeforeUnmount, onUnmounted } = Vue;
const { ElMessage, ElMessageBox } = ElementPlus;

/* ---------------- HTTP 接口层（对应 api_design.md，域名可改） ---------------- */
const API_BASE = 'http://localhost:8089/api';

/* 凭证双存储：勾选「30天保持登录」存 localStorage（长期），否则存 sessionStorage（关浏览器即失效） */
const store = {
  get: k => localStorage.getItem(k) || sessionStorage.getItem(k) || '',
  set: (k, v, remember) => {
    if (remember) { localStorage.setItem(k, v); sessionStorage.removeItem(k); }
    else { sessionStorage.setItem(k, v); localStorage.removeItem(k); }
  },
  clear: k => { localStorage.removeItem(k); sessionStorage.removeItem(k); }
};

async function apiRequest(method, path, params, body) {
  let url = API_BASE + path;
  if (params) {
    const qs = Object.entries(params)
      .filter(([, v]) => v !== undefined && v !== null && v !== '')
      .map(([k, v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v)).join('&');
    if (qs) url += '?' + qs;
  }
  const headers = { 'Content-Type': 'application/json' };
  const token = store.get('token');
  if (token) headers.Authorization = 'Bearer ' + token;
  let res;
  try {
    const resp = await fetch(url, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined });
    res = await resp.json();
  } catch (e) {
    ElMessage.error('无法连接服务器：' + API_BASE);
    throw e;
  }
  if (res.code === 200) return res.data;
  if (res.code === 401) {
    ElMessage.error('登录已过期，请重新登录');
    store.clear('token');
    window.dispatchEvent(new Event('pm-auth-changed'));
  } else {
    ElMessage.error(res.msg || '请求失败');
  }
  throw new Error(res.msg || 'request failed');
}
const apiGet = (path, params) => apiRequest('GET', path, params);
const apiPost = (path, body) => apiRequest('POST', path, null, body);
const apiPut = (path, body) => apiRequest('PUT', path, null, body);
const apiDel = path => apiRequest('DELETE', path);

/* ---------------- 通用工具 ---------------- */
const fmt = n => (Number(n) || 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const todayStr = () => {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
};
const today = todayStr();
const monthPrefix = today.slice(0, 7);
/* 份额制投资类型（A股/港股按股、基金按份），其余为金额制 */
const SHARE_TYPES = ['A股', '港股', '基金'];
const isShareType = t => SHARE_TYPES.includes(t);
const codePlaceholder = t => t === 'A股' ? '6位数字，如 600519 / 000001，自动识别市场'
  : t === '港股' ? '5位数字，如 01810' : t === '基金' ? '6位数字，如 002910' : '选填';
const dateMinusDays = days => {
  const d = new Date(); d.setDate(d.getDate() - days); d.setHours(0, 0, 0, 0);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
};

/* ---------------- 通用 CRUD 页面工厂（HTTP 版） ---------------- */
function makeCrudPage(cfg) {
  return {
    setup() {
      const list = ref([]);
      const loading = ref(false);
      const dialogVisible = ref(false);
      const form = ref({});
      const selected = ref(null);
      const filterMonth = ref(monthPrefix);
      const tableRef = ref(null);
      const selectRow = row => { selected.value = (selected.value === row.id) ? null : row.id; };
      const toggleExpand = row => { if (tableRef.value) tableRef.value.toggleRowExpansion(row); };
      const shareCount = row => row.shares || Math.max(1, Math.round((row.amount || 0) / 100));
      const num = x => Number(x) || 0;
      // 可用于收支/投资的资产（仅现金/银行卡类别）
      const cashAssets = ref([]);
      const loadCashAssets = async () => {
        const data = await apiGet('/asset/list').catch(() => []);
        const arr = Array.isArray(data) ? data : (data ? data.list || [] : []);
        cashAssets.value = arr.filter(a => a.category === '现金' || a.category === '银行卡');
      };
      // 支出类型「投资」需要选择关联投资标的（cfg.loadInvestments 时加载）
      const investments = ref([]);
      const loadInvestments = async () => {
        if (!cfg.loadInvestments) return;
        const data = await apiGet('/investment/list').catch(() => []);
        investments.value = Array.isArray(data) ? data : (data ? data.list || [] : []);
      };

      const load = async () => {
        loading.value = true;
        try {
          const params = { pageNum: 1, pageSize: 1000 };
          if (cfg.monthFilter) params.month = filterMonth.value;
          const data = await apiGet(cfg.api + '/list', params);
          list.value = Array.isArray(data) ? data : (data.list || []);
        } finally {
          loading.value = false;
        }
      };
      const refreshAll = () => { load(); window.dispatchEvent(new Event('pm-data-changed')); };

      const openDialog = row => { form.value = row ? Object.assign({}, row) : Object.assign({ id: null }, cfg.empty()); dialogVisible.value = true; };
      const handleSave = async () => {
        if (cfg.validate && !cfg.validate(form.value)) return;
        try {
          if (form.value.id) await apiPut(cfg.api + '/' + form.value.id, form.value);
          else await apiPost(cfg.api, form.value);
          ElMessage.success('保存成功');
          dialogVisible.value = false;
          loadCashAssets();
          refreshAll();
        } catch (e) { /* 错误信息已由拦截层提示 */ }
      };
      const handleDelete = async id => {
        try { await ElMessageBox.confirm('确定删除该记录吗？', '提示', { type: 'warning' }); }
        catch (e) { return; }
        try {
          await apiDel(cfg.api + '/' + id);
          if (selected.value === id) selected.value = null;
          ElMessage.success('删除成功');
          loadCashAssets();
          refreshAll();
        } catch (e) {}
      };

      const filteredList = computed(() => cfg.monthFilter
        ? list.value.filter(x => (x.recordDate || '').startsWith(filterMonth.value))
        : list.value);
      // statExclude：部分记录不计入合计（如支出类型「投资」只是资产↔投资划转）
      const total = computed(() => filteredList.value.reduce(
        (s, x) => (cfg.statExclude && cfg.statExclude(x)) ? s : s + num(x[cfg.totalField || 'amount']), 0));

      const onDataChanged = () => { load(); loadInvestments(); };
      onMounted(() => {
        load();
        loadCashAssets();
        loadInvestments();
        window.addEventListener('pm-data-changed', onDataChanged);
      });
      onBeforeUnmount(() => window.removeEventListener('pm-data-changed', onDataChanged));
      watch(filterMonth, load);
      return { list, loading, dialogVisible, form, openDialog, handleSave, handleDelete,
               total, filterMonth, filteredList, selected, selectRow, tableRef, toggleExpand,
               shareCount, cashAssets, loadCashAssets, investments, loadInvestments, fmt };
    },
    template: cfg.template
  };
}

/* ---------------- 支出：拍照识别（AI 识图，批量解析 → 人工检查修改 → 确认后记支出扣减） ---------------- */
const ExpenseRecognize = {
  setup() {
    const visible = ref(false);
    const rows = ref([]);
    const analyzing = ref(false);
    const cashAssets = ref([]);
    const categories = ['餐饮', '交通', '住房', '购物', '娱乐', '医疗', '教育', '其他'];
    const loadAssets = async () => {
      const data = await apiGet('/asset/list').catch(() => []);
      const arr = Array.isArray(data) ? data : (data ? data.list || [] : []);
      cashAssets.value = arr.filter(a => a.category === '现金' || a.category === '银行卡');
    };
    let keySeq = 0;
    const open = () => { visible.value = true; rows.value = []; loadAssets(); };
    const pickFiles = async e => {
      const files = Array.from(e.target.files || []);
      e.target.value = '';
      if (!files.length) return;
      if (files.length > 9) { ElMessage.warning('一次最多 9 张'); return; }
      await analyze(files);
    };
    const analyze = async files => {
      const fd = new FormData();
      files.forEach(f => fd.append('files', f));
      analyzing.value = true;
      try {
        const resp = await fetch(API_BASE + '/expense/recognize', {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + store.get('token') },
          body: fd
        });
        const j = await resp.json();
        if (j.code !== 200) { ElMessage.error(j.msg || '识别失败'); return; }
        const list = (j.data || []).map(r => ({ _key: 'r' + (++keySeq), saving: false, ...r }));
        rows.value = rows.value.concat(list);
        const ok = list.filter(r => !r.error).length;
        if (ok) ElMessage.success(`本批识别：成功 ${ok} 条，失败 ${list.length - ok} 条（结果已追加，可继续选图）`);
        else ElMessage.warning('本批未能识别出有效支出，可换更清晰的图片');
      } catch (err) { ElMessage.error('识别请求失败：' + err.message); }
      finally { analyzing.value = false; }
    };
    const valid = r => !r.error && Number(r.amount) > 0 && !!r.recordDate && !!r.assetId;
    const confirmAll = async () => {
      const todo = rows.value.filter(valid);
      if (!todo.length) { ElMessage.warning('没有可确认的记录（需金额>0、有日期、已选扣减资产）'); return; }
      let done = 0;
      for (const r of todo) {
        r.saving = true;
        try {
          await apiPost('/expense', {
            amount: Number(r.amount), category: r.category || '其他',
            recordDate: r.recordDate, assetId: r.assetId, remark: r.remark || ''
          });
          done++;
          rows.value.splice(rows.value.indexOf(r), 1);
        } catch (e) { /* 错误已由拦截层提示 */ }
        finally { r.saving = false; }
      }
      if (done) {
        ElMessage.success(`已记 ${done} 笔支出`);
        window.dispatchEvent(new Event('pm-data-changed'));
      }
      if (!rows.value.filter(x => !x.error).length) visible.value = false;
    };
    const removeRow = r => rows.value.splice(rows.value.indexOf(r), 1);
    return { visible, rows, analyzing, cashAssets, categories, open, pickFiles, confirmAll, valid, removeRow, fmt };
  },
  template: `
    <el-button plain @click="open">拍照识别</el-button>
    <el-dialog v-model="visible" title="拍照识别支出（AI 解析，确认后才记账）" width="880px" top="6vh">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <el-button type="primary" plain :loading="analyzing" @click="$refs.fileInput.click()">
          {{ analyzing ? '识别中…' : '选择图片（可多选）' }}
        </el-button>
        <input ref="fileInput" type="file" accept="image/*" multiple style="display:none" @change="pickFiles" />
        <span style="color:#909399;font-size:12px">支持小票 / 支付截图 / 账单列表；一次最多 9 张，多图并行识别；一张图可识别多笔；图片不保存</span>
        <div style="flex:1"></div>
        <el-button v-if="rows.length" link type="danger" size="small" @click="rows = []">清空结果</el-button>
      </div>
      <el-table :data="rows" v-if="rows.length" size="small" border max-height="420">
        <el-table-column label="金额（¥）" width="130">
          <template #default="{ row }">
            <el-input-number v-if="!row.error" v-model="row.amount" :min="0" :precision="2" size="small" style="width:115px" controls-position="right" />
          </template>
        </el-table-column>
        <el-table-column label="分类" width="105">
          <template #default="{ row }">
            <el-select v-if="!row.error" v-model="row.category" size="small" style="width:95px">
              <el-option v-for="c in categories" :key="c" :label="c" :value="c" />
            </el-select>
          </template>
        </el-table-column>
        <el-table-column label="支出日期" width="140">
          <template #default="{ row }">
            <el-input v-if="!row.error" v-model="row.recordDate" size="small" placeholder="YYYY-MM-DD" />
          </template>
        </el-table-column>
        <el-table-column label="扣减资产" width="185">
          <template #default="{ row }">
            <template v-if="!row.error">
              <el-select v-model="row.assetId" size="small" style="width:175px" placeholder="选择资产">
                <el-option v-for="a in cashAssets" :key="a.id" :label="a.name" :value="a.id" />
              </el-select>
              <div v-if="row.assetHint && !row.assetId" style="color:#e6a23c;font-size:11px">识别渠道：{{ row.assetHint }}（未匹配，请手选）</div>
            </template>
          </template>
        </el-table-column>
        <el-table-column label="备注" min-width="150">
          <template #default="{ row }">
            <el-input v-if="!row.error" v-model="row.remark" size="small" />
            <el-tag v-else type="danger" size="small">{{ row.error }}</el-tag>
          </template>
        </el-table-column>
        <el-table-column label="" width="60" align="center">
          <template #default="{ row }"><el-button link type="danger" size="small" @click="removeRow(row)">移除</el-button></template>
        </el-table-column>
      </el-table>
      <el-empty v-else description="还没有识别结果，点击上方按钮选择图片" :image-size="70" />
      <template #footer>
        <el-button @click="visible = false">取消</el-button>
        <el-button type="primary" :disabled="!rows.filter(valid).length" @click="confirmAll">
          确认记支出（{{ rows.filter(valid).length }} 笔）
        </el-button>
      </template>
    </el-dialog>`
};

/* ---------------- 卖出逻辑：包一层在 CRUD 工厂之上 ---------------- */
const InvestmentPage = {
  setup() {
    const base = InvestmentPageRaw.setup();
    const sellVisible = ref(false);
    const sellRow = ref(null);
    const sellForm = ref({ assetId: null, shares: null, price: null, amount: null, fee: null, tradeDate: todayStr() });
    const openSell = row => {
      sellRow.value = row;
      sellForm.value = { assetId: null, shares: null, price: null, amount: null, fee: null, tradeDate: todayStr() };
      sellVisible.value = true;
    };
    const buyVisible = ref(false);
    const buyRow = ref(null);
    const buyForm = ref({ shares: null, price: null, fee: null, tradeDate: todayStr(), assetId: null, remark: '' });
    const openBuy = row => {
      buyRow.value = row;
      buyForm.value = { shares: null, price: null, fee: null, tradeDate: todayStr(), assetId: null, remark: '' };
      buyVisible.value = true;
    };
    const handleBuy = async () => {
      const f = buyForm.value;
      if (!(f.shares > 0)) { ElMessage.warning(buyRow.value.type === '基金' ? '请填写买入份额' : '请填写买入股数'); return; }
      if (!(Number(f.price) > 0)) { ElMessage.warning(buyRow.value.type === '基金' ? '请填写买入净值' : '请填写买入股价'); return; }
      if (!f.tradeDate) { ElMessage.warning('请选择买入日期'); return; }
      try {
        await apiPost('/investment/' + buyRow.value.id + '/buy', f);
        ElMessage.success('买入成功');
        buyVisible.value = false;
        base.loadCashAssets();
        window.dispatchEvent(new Event('pm-data-changed'));
      } catch (e) { /* 错误信息已由拦截层提示 */ }
    };
    const handleSell = async () => {
      const f = sellForm.value;
      if (isShareType(sellRow.value.type)) {
        if (!(f.shares > 0)) { ElMessage.warning(sellRow.value.type === '基金' ? '请填写卖出份额' : '请填写卖出股数'); return; }
        if (f.shares > sellRow.value.shares) { ElMessage.warning(sellRow.value.type === '基金' ? '卖出份额不能超过当前持有份额' : '卖出股数不能超过当前持股数'); return; }
      } else if (!(Number(f.amount) > 0)) {
        ElMessage.warning('请填写卖出金额'); return;
      }
      try {
        await apiPost('/investment/' + sellRow.value.id + '/sell', f);
        ElMessage.success('卖出成功');
        sellVisible.value = false;
        base.loadCashAssets();
        window.dispatchEvent(new Event('pm-data-changed'));
      } catch (e) { /* 错误信息已由拦截层提示 */ }
    };
    const refreshQuotes = async () => {
      try {
        await apiPost('/market/refresh', {});
        await base.load();
        ElMessage.success('行情已刷新');
      } catch (e) { /* 错误信息已由拦截层提示 */ }
    };
    /* 交易记录：行的买卖台账明细（编辑入口移至本对话框底部） */
    const tradesVisible = ref(false);
    const tradesRow = ref(null);
    const tradesList = ref([]);
    const openTrades = async row => {
      tradesRow.value = row;
      tradesList.value = (await apiGet('/investment/' + row.id + '/trades').catch(() => [])) || [];
      tradesVisible.value = true;
    };
    /* 行情代码防抖搜索：停留 1s 后调 /market/validate 校验并带出名称；
       走裸 fetch 而非 apiPost，避免搜索过程中的失败频繁弹错误提示（失败静默返回空列表） */
    const searchCode = (query, cb) => {
      const q = (query || '').trim();
      if (!q) { cb([]); return; }
      const type = base.form.value ? base.form.value.type : '';
      const token = store.get('token');
      fetch(API_BASE + '/market/validate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
        body: JSON.stringify({ code: q, type: type })
      }).then(r => r.ok ? r.json() : null).then(res => {
        if (res && res.code === 200 && res.data && res.data.name) {
          cb([{ value: q, name: res.data.name }]);
        } else {
          cb([]);
        }
      }).catch(() => cb([]));
    };
    const pickCode = item => { base.form.value.name = item.name; };
    /* 外部渠道同步管理：手动添加同花顺账户（账户名校验登记），同步由本机辅助程序推送 */
    const channelVisible = ref(false);
    const channels = ref([]);
    const channelForm = ref({ channel: 'THS', accountName: '', remark: '' });
    const CHANNEL_NAMES = { THS: '同花顺' };
    const channelName = c => CHANNEL_NAMES[c] || c;
    const fmtSyncTime = t => t ? String(t).replace('T', ' ').substring(0, 19) : '未同步';
    const loadChannels = async () => {
      const data = await apiGet('/external/channel/list').catch(() => []);
      channels.value = Array.isArray(data) ? data : [];
    };
    const openChannels = () => { channelVisible.value = true; loadChannels(); };
    const addChannel = async () => {
      const f = channelForm.value;
      if (!f.accountName || !f.accountName.trim()) { ElMessage.warning('请填写同花顺登录用户名'); return; }
      try {
        await apiPost('/external/channel', { channel: f.channel, accountName: f.accountName.trim(), remark: f.remark });
        ElMessage.success('渠道已添加，账户名校验通过后可接收同步');
        channelForm.value = { channel: 'THS', accountName: '', remark: '' };
        await loadChannels();
      } catch (e) { /* 拦截层已提示 */ }
    };
    const deleteChannel = async id => {
      try { await ElMessageBox.confirm('删除后该账户将无法再推送同步，已同步的投资不受影响。确定删除？', '提示', { type: 'warning' }); }
      catch (e) { return; }
      try {
        await apiDel('/external/channel/' + id);
        ElMessage.success('已删除');
        await loadChannels();
      } catch (e) { /* 拦截层已提示 */ }
    };
    const copyKey = async row => {
      try {
        await navigator.clipboard.writeText(row.apiKey || '');
        ElMessage.success('推送凭证已复制，配置到 ths_push_agent.py 的 THS_API_KEY 中');
      } catch (e) { ElMessage.warning('复制失败，请手动选择复制'); }
    };
    /* 盘中实时刷新：工作日交易时段（含港股 9:30-16:30）每 10s 拉一次列表，
       后端行情缓存同步按 10s 刷新，最新价/最新盈亏/当前市值随之实时变动；盘后自动停止 */
    const quoteTimer = setInterval(() => {
      const n = new Date();
      const day = n.getDay();
      const mins = n.getHours() * 60 + n.getMinutes();
      const inWindow = day >= 1 && day <= 5 && mins >= 555 && mins <= 16 * 60 + 35;
      if (inWindow && document.visibilityState === 'visible') base.load();
    }, 10000);
    onUnmounted(() => clearInterval(quoteTimer));
    /* 移动端：卡片式投资列表（免横向滑动），点击展开走势图 */
    const mob = ref(window.innerWidth <= 768);
    const onWinResize = () => { mob.value = window.innerWidth <= 768; };
    window.addEventListener('resize', onWinResize);
    onUnmounted(() => window.removeEventListener('resize', onWinResize));
    const expandedId = ref(null);
    const toggleCard = row => { expandedId.value = expandedId.value === row.id ? null : row.id; };
    return { ...base, isShareType, codePlaceholder, mob, expandedId, toggleCard,
             sellVisible, sellRow, sellForm, openSell, handleSell,
             buyVisible, buyRow, buyForm, openBuy, handleBuy, refreshQuotes,
             tradesVisible, tradesRow, tradesList, openTrades,
             searchCode, pickCode,
             channelVisible, channels, channelForm, channelName, fmtSyncTime, openChannels, addChannel, deleteChannel, copyKey };
  },
  template: InvestmentPageRaw.template
};

/* ---------------- 资产列表并入投资（只读展示，增删改请到投资页） ---------------- */
const AssetPage = {
  setup() {
    const base = AssetPageRaw.setup();
    // 编辑时清空入账日期：留空表示本次修改只反映到今日，避免误把新估值写回历史日期
    const rawOpenDialog = base.openDialog;
    base.openDialog = row => { rawOpenDialog(row); if (row) { base.form.value.changeDate = null; } };
    const invests = ref([]);
    const loadInvests = async () => {
      const data = await apiGet('/investment/list').catch(() => []);
      const arr = Array.isArray(data) ? data : (data ? data.list || [] : []);
      invests.value = arr
        // 清仓（市值为 0）的投资不在资产列表/构成中展示，只在资产走势中体现历史
        .filter(i => (Number(i.currentValue) || 0) > 0)
        .map(i => ({
          id: 'inv-' + i.id,
          _invest: true,
          name: i.name,
          category: '投资·' + (i.type || '其他'),
          value: i.currentValue,
          remark: i.remark || ''
        }));
    };
    // 资产在前、投资在后；总数与净值含投资
    const list = computed(() => [...base.list.value, ...invests.value]);
    const num = x => Number(x) || 0;
    const total = computed(() => list.value.reduce((s, x) => s + num(x.value), 0));
    // 净资产卡片右上：投资按类型汇总（仅持仓市值 > 0 的）
    const byType = computed(() => {
      const g = {};
      invests.value.forEach(x => {
        const t = (x.category || '').replace(/^投资·/, '') || '其他';
        g[t] = (g[t] || 0) + num(x.value);
      });
      return Object.keys(g).map(k => ({ type: k, value: Math.round(g[k] * 100) / 100 }));
    });
    onMounted(loadInvests);
    window.addEventListener('pm-data-changed', loadInvests);
    onBeforeUnmount(() => window.removeEventListener('pm-data-changed', loadInvests));

    /* 资产卖出：仅非现金/银行卡类别，卖出价格进入资金去向（现金/银行卡资产） */
    const sellVisible = ref(false);
    const sellRow = ref(null);
    const sellForm = ref({ price: null, assetId: null });
    const sellable = row => row.category !== '现金' && row.category !== '银行卡';
    const openSell = row => { sellRow.value = row; sellForm.value = { price: row.value, assetId: null }; sellVisible.value = true; };
    const handleSell = async () => {
      if (!(sellForm.value.price > 0)) { ElMessage.warning('请填写卖出价格'); return; }
      if (!sellForm.value.assetId) { ElMessage.warning('请选择资金去向'); return; }
      try {
        await apiPost('/asset/' + sellRow.value.id + '/sell', sellForm.value);
        ElMessage.success('已卖出');
        sellVisible.value = false;
        base.loadCashAssets();
        base.load();
        window.dispatchEvent(new Event('pm-data-changed'));
      } catch (e) { /* 拦截层已提示 */ }
    };
    return { ...base, list, total, byType, sellable, sellVisible, sellRow, sellForm, openSell, handleSell };
  },
  template: AssetPageRaw.template
};

/* ---------------- 移动端通用：胶囊区间（1月/3月/半年/1年/全部/自定义） + 滑轮日期弹层 ----------------
 * 自定义弹层为自绘底部滑轮（年/月/日），无 input 焦点，iOS 不会触发页面缩放；
 * 展示与操作均为中文日期（如 2024年3月12日）。 */
const RANGE_PRESETS = [
  { key: '1m',  label: '1月',  months: 1 },
  { key: '3m',  label: '3月',  months: 3 },
  { key: '6m',  label: '半年', months: 6 },
  { key: '1y',  label: '1年',  months: 12 },
  { key: 'all', label: '全部' },
  { key: 'custom', label: '自定义' },
];
const fmtDateCN = (y, m, d) => y + '年' + m + '月' + d + '日';
const MobileWheelRange = {
  props: { start: String, end: String },
  emits: ['confirm', 'cancel'],
  setup(props, { emit }) {
    const H = 36; // 滑轮单行高
    const parse = s => { const p = (s || todayStr()).split('-'); return { y: +p[0], m: +p[1] || 1, d: +p[2] || 1 }; };
    const curYear = new Date().getFullYear();
    const years = []; for (let y = curYear - 12; y <= curYear + 3; y++) years.push(y);
    const months12 = Array.from({ length: 12 }, (_, i) => i + 1);
    const s0 = parse(props.start), e0 = parse(props.end);
    const sel = reactive({ sy: s0.y, sm: s0.m, sd: s0.d, ey: e0.y, em: e0.m, ed: e0.d });
    const dim = (y, m) => new Date(y, m, 0).getDate(); // 当月天数
    const sDays = computed(() => dim(sel.sy, sel.sm));
    const eDays = computed(() => dim(sel.ey, sel.em));
    const fix = () => { if (sel.sd > sDays.value) sel.sd = sDays.value; if (sel.ed > eDays.value) sel.ed = eDays.value; };
    watch([sDays, eDays], fix);
    const root = ref(null);
    const confOf = k => {
      if (k === 'sy') return { list: years, get: () => sel.sy, set: v => sel.sy = v };
      if (k === 'sm') return { list: months12, get: () => sel.sm, set: v => sel.sm = v };
      if (k === 'sd') return { list: Array.from({ length: sDays.value }, (_, i) => i + 1), get: () => sel.sd, set: v => sel.sd = v };
      if (k === 'ey') return { list: years, get: () => sel.ey, set: v => sel.ey = v };
      if (k === 'em') return { list: months12, get: () => sel.em, set: v => sel.em = v };
      return { list: Array.from({ length: eDays.value }, (_, i) => i + 1), get: () => sel.ed, set: v => sel.ed = v };
    };
    // 滚动停止后吸附到最近一行并回写选中值
    const onWheel = k => ev => {
      const el = ev.target;
      clearTimeout(el._wt);
      el._wt = setTimeout(() => {
        const conf = confOf(k);
        let idx = Math.round(el.scrollTop / H);
        idx = Math.max(0, Math.min(idx, conf.list.length - 1));
        if (Math.abs(el.scrollTop - idx * H) > 1) el.scrollTop = idx * H;
        if (conf.get() !== conf.list[idx]) conf.set(conf.list[idx]);
      }, 90);
    };
    onMounted(() => {
      const set = (k, idx) => { const el = root.value.querySelector('[data-wheel="' + k + '"]'); if (el) el.scrollTop = Math.max(0, idx) * H; };
      set('sy', years.indexOf(sel.sy)); set('sm', sel.sm - 1); set('sd', sel.sd - 1);
      set('ey', years.indexOf(sel.ey)); set('em', sel.em - 1); set('ed', sel.ed - 1);
    });
    const sText = computed(() => fmtDateCN(sel.sy, sel.sm, sel.sd));
    const eText = computed(() => fmtDateCN(sel.ey, sel.em, sel.ed));
    const pad = n => String(n).padStart(2, '0');
    const ok = () => emit('confirm', sel.sy + '-' + pad(sel.sm) + '-' + pad(sel.sd), sel.ey + '-' + pad(sel.em) + '-' + pad(sel.ed));
    const cancel = () => emit('cancel');
    return { root, years, months12, sDays, eDays, onWheel, sText, eText, ok, cancel };
  },
  template: `<div class="wr-mask" ref="root" @click="cancel">
    <div class="wr-sheet" @click.stop>
      <div class="wr-head"><span class="wr-cancel" @click="cancel">取消</span><b>选择日期范围</b><span class="wr-ok" @click="ok">确定</span></div>
      <div class="wr-title">{{ sText }}<i>至</i>{{ eText }}</div>
      <div class="wr-group">
        <span class="wr-label">开始</span>
        <div class="wr-wheels">
          <div class="wr-wheel" data-wheel="sy" @scroll="onWheel('sy')"><div class="wr-item" v-for="y in years" :key="y">{{ y }}年</div></div>
          <div class="wr-wheel" data-wheel="sm" @scroll="onWheel('sm')"><div class="wr-item" v-for="m in months12" :key="m">{{ m }}月</div></div>
          <div class="wr-wheel" data-wheel="sd" @scroll="onWheel('sd')"><div class="wr-item" v-for="d in sDays" :key="d">{{ d }}日</div></div>
        </div>
      </div>
      <div class="wr-group">
        <span class="wr-label">结束</span>
        <div class="wr-wheels">
          <div class="wr-wheel" data-wheel="ey" @scroll="onWheel('ey')"><div class="wr-item" v-for="y in years" :key="'e' + y">{{ y }}年</div></div>
          <div class="wr-wheel" data-wheel="em" @scroll="onWheel('em')"><div class="wr-item" v-for="m in months12" :key="'e' + m">{{ m }}月</div></div>
          <div class="wr-wheel" data-wheel="ed" @scroll="onWheel('ed')"><div class="wr-item" v-for="d in eDays" :key="'e' + d">{{ d }}日</div></div>
        </div>
      </div>
    </div>
  </div>`
};
const RangePills = {
  props: { start: String, end: String },
  emits: ['change'],
  setup(props, { emit }) {
    const active = ref('1y');
    const customVisible = ref(false);
    const pad = n => String(n).padStart(2, '0');
    const fmtD = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    const pick = p => {
      if (p.key === 'custom') { customVisible.value = true; return; }
      active.value = p.key;
      if (p.key === 'all') { emit('change', { start: '', end: '', preset: 'all' }); return; }
      const end = new Date();
      const start = new Date(end.getFullYear(), end.getMonth() - p.months + 1, 1);
      emit('change', { start: fmtD(start), end: fmtD(end), preset: p.key });
    };
    const onCustom = (s, e) => { customVisible.value = false; active.value = 'custom'; emit('change', { start: s, end: e, preset: 'custom' }); };
    return { RANGE_PRESETS, active, customVisible, pick, onCustom, start: props.start, end: props.end };
  },
  template: `<div class="rp-pills">
      <span v-for="p in RANGE_PRESETS" :key="p.key" class="rp-pill" :class="{ on: active === p.key }" @click="pick(p)">{{ p.label }}</span>
      <MobileWheelRange v-if="customVisible" :start="start" :end="end" @confirm="onCustom" @cancel="customVisible = false" />
    </div>`
};

/* ---------------- 投资：按天的投入趋势折线图（新增/累计投入 + 总市值） ---------------- */
const InvestTrendChart = {
  setup() {
    const el = ref(null);
    let chart = null;
    const now = new Date();
    const ymOf = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    const ds = new Date(now.getFullYear(), now.getMonth() - 11, 1);
    const fmtDay = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const range = ref([ymOf(ds), ymOf(now)]);
    const num = x => Number(x) || 0;
    let rangeInited = false;
    // 移动端胶囊区间回调：preset=all 时退回「最早买入月起至今」
    const onPill = ({ start, end, preset }) => {
      if (preset === 'all') { rangeInited = false; render(); return; }
      range.value = [start, end];
    };
    const render = async () => {
      if (!chart) return;
      const mob = window.innerWidth <= 768; // 移动端：图大、标尺小、y 轴刻度靠右
      const list = await apiGet('/investment/list').catch(() => []);
      const invs = Array.isArray(list) ? list : (list ? list.list || [] : []);
      // 首次渲染把范围初始化为「最早买入月起至今」：只看近一年时，早已清仓的标的历史全部落在窗外，曲线像空白
      if (!rangeInited) {
        rangeInited = true;
        const buys = invs.map(x => (x.buyDate || '').slice(0, 7)).filter(Boolean).sort();
        range.value = [buys.length ? buys[0] : ymOf(ds), ymOf(now)];
      }
      // 区间支持月（YYYY-MM，选月粒度）与日（YYYY-MM-DD，胶囊/滑轮粒度），曲线始终精确到天
      const r0 = range.value[0], r1 = range.value[1];
      const start = r0.length === 7 ? r0 + '-01' : r0;
      let end;
      if (r1.length === 7) { const [ey, em] = r1.split('-').map(Number); end = fmtDay(new Date(ey, em, 0)); }
      else end = r1;
      // 生成范围内每一天（x 轴精细到天）
      const days = [];
      {
        const d = new Date(start + 'T00:00:00');
        const endD = new Date(end + 'T00:00:00');
        let guard = 0;
        while (d <= endD && guard < 2000) {
          days.push(fmtDay(d));
          d.setDate(d.getDate() + 1);
          guard++;
        }
      }
      // 持仓成本口径（摊薄成本，与同花顺一致）：累计买入金额 − 累计卖出金额，
      // 「总市值 − 持仓成本」即总盈亏（含已落袋部分），清仓时两者一起归零；
      // 「新增投入」线只统计买入金额（不出现负数）；
      // 无台账的老投资（直接录金额的类型）退回按买入日 + 投入金额
      const tradesArr = await Promise.all(invs.map(inv =>
        apiGet('/investment/' + inv.id + '/trades').catch(() => [])));
      const buyByDay = {};
      const costDeltaByDay = {};
      invs.forEach((inv, k) => {
        const ts = (Array.isArray(tradesArr[k]) ? tradesArr[k] : []).slice()
          .sort((a, b) => (a.tradeDate || '').localeCompare(b.tradeDate || ''));
        ts.forEach(t => {
          const d = (t.tradeDate || '').slice(0, 10);
          if (!d) return;
          if (t.tradeType === 'BUY') {
            buyByDay[d] = (buyByDay[d] || 0) + num(t.amount);
            costDeltaByDay[d] = (costDeltaByDay[d] || 0) + num(t.amount);
          } else if (t.tradeType === 'SELL') {
            // 摊薄口径：卖出按成交金额全额扣减成本（卖出盈利抵减成本），与平均成本法的差异即已实现盈亏
            costDeltaByDay[d] = (costDeltaByDay[d] || 0) - num(t.amount);
          }
        });
        if (ts.length === 0 && inv.buyDate && num(inv.amount) > 0) {
          buyByDay[inv.buyDate] = (buyByDay[inv.buyDate] || 0) + num(inv.amount);
          costDeltaByDay[inv.buyDate] = (costDeltaByDay[inv.buyDate] || 0) + num(inv.amount);
        }
      });
      // 「新增投入」线：只统计买入金额，不出现负数
      const daily = days.map(day => Math.round((buyByDay[day] || 0) * 100) / 100);
      // 「持仓成本」线：每日成本净变动（买入为正、卖出按成交金额扣减为负）的累加，跨天自然延续
      const cumulative = [];
      {
        let lastC = 0;
        days.forEach(day => {
          lastC += costDeltaByDay[day] || 0;
          cumulative.push(Math.round(lastC * 100) / 100);
        });
      }
      const trends = await Promise.all(invs.map(inv =>
        apiGet('/investment/' + inv.id + '/trend', { start: start, end: end }).catch(() => [])));
      // 服务重启窗口等请求失败时保留旧图不重绘，避免画出误导性的全零曲线
      if (invs.length > 0 && trends.every(t => !Array.isArray(t) || t.length === 0)) return;
      // 逐日取各标的「不晚于当日」的最新市值：趋势数组按日期升序，每个标的用单调游标，O(点数)；
      // 无新快照的日子（周末/节假日）沿用最近一个值——lastV 必须跨天保留，不能每天重置成 0
      const idx = trends.map(() => 0);
      const lastV = trends.map(() => 0);
      const totalMV = days.map(day => {
        let s = 0;
        trends.forEach((t, k) => {
          let i = idx[k];
          while (i < t.length && (t[i].date || '') <= day) { lastV[k] = num(t[i].value); i++; }
          idx[k] = i;
          s += lastV[k];
        });
        return Math.round(s * 100) / 100;
      });
      chart.setOption({
        textStyle: { fontFamily: '-apple-system, "PingFang SC", "Helvetica Neue", sans-serif' },
        tooltip: {
          trigger: 'axis',
          textStyle: { fontSize: mob ? 11 : 13 },
          valueFormatter: v => '¥ ' + Number(v).toLocaleString('zh-CN', { minimumFractionDigits: 2 })
        },
        legend: mob
          ? { data: ['新增投入', '持仓成本', '总市值'], top: 4, right: 4, icon: 'roundRect', itemWidth: 10, itemHeight: 3, textStyle: { fontSize: 10, color: '#6e6e73' } }
          : { data: ['新增投入', '持仓成本', '总市值'], top: 8, right: 16, icon: 'roundRect', itemWidth: 14, itemHeight: 4 },
        grid: mob ? { left: 4, right: 4, top: 30, bottom: 4, containLabel: true } : { left: 10, right: 18, top: 48, bottom: 6, containLabel: true },
        xAxis: {
          type: 'category', boundaryGap: false, data: days.map(m => m.slice(2)),
          axisLine: { lineStyle: { color: 'rgba(0,0,0,0.12)' } },
          axisTick: { show: false }, axisLabel: { color: '#86868b', fontSize: mob ? 10 : 12 }
        },
        yAxis: {
          type: 'value', position: mob ? 'right' : 'left',
          splitLine: { lineStyle: { color: 'rgba(0,0,0,0.06)' } },
          axisLabel: { color: '#86868b', fontSize: mob ? 10 : 12, formatter: v => Math.abs(v) >= 10000 ? Math.round(v / 10000) + '万' : v }
        },
        series: [
          {
            name: '新增投入', type: 'line', smooth: false, symbol: 'circle', symbolSize: 7,
            data: daily,
            lineStyle: { width: 2.5, color: '#007aff' }, itemStyle: { color: '#007aff', borderColor: '#fff', borderWidth: 2 },
            areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: 'rgba(0,122,255,0.22)' }, { offset: 1, color: 'rgba(0,122,255,0.02)' }]) }
          },
          {
            name: '持仓成本', type: 'line', smooth: false, symbol: 'none',
            data: cumulative,
            lineStyle: { width: 2, type: 'dashed', color: '#8e8e93' }, itemStyle: { color: '#8e8e93' }
          },
          {
            name: '总市值', type: 'line', smooth: false, symbol: 'circle', symbolSize: 6,
            data: totalMV,
            lineStyle: { width: 2.5, color: '#ff9500' }, itemStyle: { color: '#ff9500', borderColor: '#fff', borderWidth: 2 },
            areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: 'rgba(255,149,0,0.12)' }, { offset: 1, color: 'rgba(255,149,0,0.01)' }]) }
          }
        ]
      }, true);
    };
    const resize = () => { if (!chart) return; chart.resize(); render(); };
    watch(range, render);
    onMounted(() => {
      chart = echarts.init(el.value);
      render();
      window.addEventListener('resize', resize);

        },
        series: [{
          name: '盈亏', type: 'line', smooth: false, symbol: mob ? 'none' : 'circle', symbolSize: 6,
          data: rows.map(r => r.profit),
          // 盈利红、亏损绿（与全局配色一致）
          itemStyle: { color: p => (Number(p.value) >= 0 ? '#f56c6c' : '#67c23a'), borderColor: '#fff', borderWidth: 2 },

          areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: 'rgba(64,158,255,0.16)' }, { offset: 1, color: 'rgba(64,158,255,0.01)' }]) },

      <b style="color:#1d1d1f;font-size:15px">盈亏走势</b>
      <el-date-picker v-model="range" type="monthrange" value-format="YYYY-MM" :clearable="false" class="desk-range"

const InvestDailyChart = {
  props: { invId: Number },
  setup(props) {
    const el = ref(null);
    let chart = null;
    const range = ref('all');
    const info = ref({ name: '', profit: 0 });
    const num = x => Number(x) || 0;
    const render = async () => {
      if (!chart) return;
      // 展开行动画期间容器宽度可能为 0，echarts 初始化尺寸为 0 后 setOption 不会自动恢复，
      // 每次渲染前强制重算尺寸（首次点开空白、重选范围才显示的根因）
      chart.resize();
      const list = await apiGet('/investment/list').catch(() => []);
      const invs = Array.isArray(list) ? list : (list ? list.list || [] : []);
      const inv = invs.find(x => x.id === props.invId);
      const trades = (await apiGet('/investment/' + props.invId + '/trades').catch(() => [])) || [];
      let start = dateMinusDays(30);
      if (range.value === '1m') start = dateMinusDays(30);
      else if (range.value === '3m') start = dateMinusDays(90);
      else if (range.value === '6m') start = dateMinusDays(180);
      else if (range.value === '1y') start = dateMinusDays(365);
      else if (range.value === '2y') start = dateMinusDays(730);
      else if (range.value === '3y') start = dateMinusDays(1095);
      else if (range.value === '5y') start = dateMinusDays(1825);
      else {
        // 全部/默认：从买入日（或最早一笔交易）开始展示
        const cands = [];
        if (inv && inv.buyDate) cands.push(inv.buyDate);
        trades.forEach(t => { if (t.tradeDate) cands.push(t.tradeDate); });
        start = cands.length ? cands.sort()[0] : '2000-01-01';
      }
      const trend = await apiGet('/investment/' + props.invId + '/trend', { start: start, end: todayStr() }).catch(() => []);
      if (!inv || !trend || !trend.length) { chart.clear(); return; }
      // x 轴用完整日期（跨年范围下 MM-DD 会重复，导致买卖标记坐标错位/图渲染异常）
      const dts = trend.map(t => (t.date || '').slice(0, 10));
      const vals = trend.map(t => num(t.value));
      const prices = trend.map(t => num(t.price));
      // 当日盈亏 = 市值日差 − 当日净投入（买入金额）+ 当日净回款（卖出金额）：
      // 剔除资金进出后剩下的才是行情/汇率波动产生的真实盈亏，
      // 直接取市值日差会把买入日市值跳变误算成盈利
      const flowByDay = {};
      trades.forEach(t => {
        const d = (t.tradeDate || '').slice(0, 10);
        if (!d) return;
        flowByDay[d] = (flowByDay[d] || 0) + (t.tradeType === 'BUY' ? num(t.amount) : -num(t.amount));
      });
      const daily = vals.map((v, i) => i === 0 ? 0
          : Math.round((v - vals[i - 1] - (flowByDay[dts[i]] || 0)) * 100) / 100);
      // 买卖标记：标在股价走势上（价格轴），交易日期落在当前时间范围内时——垂直短虚线 + 色块字母标（买=B 红，卖=S 绿）
      const priceByDate = {};
      trend.forEach(t => { priceByDate[(t.date || '').slice(0, 10)] = num(t.price); });
      const pMax = Math.max(1, ...prices.map(Math.abs));
      const markers = [];
      const stems = [];
      (trades || []).forEach(t => {
        const label = (t.tradeDate || '').slice(0, 10);
        if (!(label in priceByDate)) return;
        const isBuy = t.tradeType === 'BUY';
        const color = isBuy ? '#ff3b30' : '#34c759';
        const p = priceByDate[label];
        markers.push({
          name: isBuy ? 'B' : 'S',
          value: [label, p],
          itemStyle: { color },
          trade: t
        });
        // 短虚线：从标记点向上延伸约 6% 价格量程（markLine 自定义线段是「两端点数组」格式）
        stems.push([
          { coord: [label, p], symbol: 'none' },
          { coord: [label, p + pMax * 0.06], symbol: 'none',
            lineStyle: { type: 'dashed', width: 1.5, color } }
        ]);
      });
      info.value = {
        name: inv.name,
        profit: Math.round((num(inv.currentValue) - num(inv.amount)) * 100) / 100
      };
      chart.setOption({
        textStyle: { fontFamily: '-apple-system, "PingFang SC", "Helvetica Neue", sans-serif' },
        tooltip: {
          trigger: 'axis',
          formatter: ps => {
            let html = ps.length ? ps[0].axisValue : '';
            const priceUnit = (inv.code || '').startsWith('hk') ? '港币' : '元';
            (ps || []).forEach(p => {
              if (p.seriesName === '买卖标记') {
                // 买入/卖出标记：悬停显示交易时间、股数/份额、单价、金额
                const t = (p.data && p.data.trade) || {};
                const isBuy = t.tradeType === 'BUY';
                html += `<br/><span style="color:${isBuy ? '#ff3b30' : '#34c759'}">●</span> ` +
                        (isBuy ? '买入' : '卖出') + ' ' + (t.tradeDate || '') +
                        (t.shares != null ? '　' + t.shares + (inv.type === '基金' ? ' 份' : ' 股') : '') +
                        (t.price != null ? '　单价 ' + t.price + ' ' + priceUnit : '') +
                        (t.amount != null ? '　金额 ¥ ' + Number(t.amount).toLocaleString('zh-CN', { minimumFractionDigits: 2 }) : '');
              } else if (p.seriesName === '价格') {
                html += `<br/>${p.marker}${p.seriesName}：${Number(p.value).toFixed(4)} ${priceUnit}`;
              } else {
                html += `<br/>${p.marker}${p.seriesName}：¥ ${Number(p.value).toLocaleString('zh-CN', { minimumFractionDigits: 2 })}`;
              }
            });
            return html;
          }
        },
        legend: { data: ['市值', '当日盈亏', '价格'], top: 4, right: 16, icon: 'roundRect', itemWidth: 14, itemHeight: 4 },
        grid: { left: 10, right: 10, top: 40, bottom: 4, containLabel: true },
        xAxis: {
          type: 'category', data: dts,
          axisLine: { lineStyle: { color: 'rgba(0,0,0,0.12)' } },
          axisTick: { show: false },
          // 点数多时间范围大时标签不要太细：>120 点只保留约 12 个「年月」标签并倾斜
          axisLabel: {
            color: '#86868b',
            interval: dts.length > 120 ? (i => i % Math.ceil(dts.length / 12) === 0) : 'auto',
            rotate: 0,
            formatter: v => dts.length > 120 ? v.slice(0, 7) : v.slice(5)
          }
        },
        yAxis: [
          {
            type: 'value', scale: true,
            splitLine: { lineStyle: { color: 'rgba(0,0,0,0.06)' } },
            axisLabel: { color: '#86868b', formatter: v => v >= 10000 ? (v / 10000) + '万' : v }
          },
          { type: 'value', scale: true, position: 'right', splitLine: { show: false }, axisLabel: { color: '#86868b' } },
          {
            // 价格轴：股价/净值（原始币种），买入前无持仓市值为 0 但价格走势仍完整可见
            type: 'value', scale: true, position: 'right', offset: 48,
            splitLine: { show: false }, axisLabel: { color: '#8e8e93' }
          }
        ],
        series: [
          {
            name: '市值', type: 'line', smooth: false, symbol: 'none', data: vals,
            lineStyle: { width: 2.5, color: '#007aff' }, itemStyle: { color: '#007aff' },
            areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: 'rgba(0,122,255,0.18)' }, { offset: 1, color: 'rgba(0,122,255,0.02)' }]) }
          },
          {
            // 买卖标记用 scatter 系列（markPoint 在展开行初次渲染时序下不渲染）：
            // 红色方框白字 B=买入，绿色方框白字 S=卖出；坐标走价格轴（股价走势）
            name: '买卖标记', type: 'scatter', yAxisIndex: 2, data: markers, z: 10,
            symbol: 'rect', symbolSize: 18,
            label: { show: true, position: 'inside', formatter: p => p.data.name,
                     color: '#fff', fontSize: 11, fontWeight: 'bold' }
          },
          {
            name: '价格', type: 'line', yAxisIndex: 2, data: prices, symbol: 'none',
            lineStyle: { width: 1.5, color: '#8e8e93' }, itemStyle: { color: '#8e8e93' },
            // 短虚线买卖标记挂在价格系列上（markLine 的 y 值随所属系列的价格轴解释）
            markLine: stems.length ? {
              silent: true, symbol: 'none',
              data: stems
            } : undefined
          },
          {
            name: '当日盈亏', type: 'bar', yAxisIndex: 1, data: daily, barMaxWidth: 8,
            itemStyle: { color: p => p.value >= 0 ? 'rgba(255,59,48,0.75)' : 'rgba(52,199,89,0.75)', borderRadius: [2, 2, 2, 2] }
          }
        ]
      }, true);
    };
    const resize = () => chart && chart.resize();
    watch(range, render);
    watch(() => props.invId, render);
    onMounted(() => {
      chart = echarts.init(el.value);
      render();
      window.addEventListener('resize', resize);
      window.addEventListener('pm-data-changed', render);
    });
    onBeforeUnmount(() => {
      window.removeEventListener('resize', resize);
      window.removeEventListener('pm-data-changed', render);
      chart && chart.dispose();
    });
    return { el, render, range, info, fmt };
  },
  template: `<el-card style="height:100%">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <b style="color:#1d1d1f;font-size:15px">{{ info.name }} · 每日走势</b>
      <div style="display:flex;align-items:center;gap:12px">
        <span style="font-size:13px;color:#6e6e73">累计盈亏：
          <b :style="info.profit >= 0 ? 'color:#ff3b30' : 'color:#34c759'">{{ (info.profit >= 0 ? '+' : '') + fmt(info.profit) }}</b>
        </span>
        <el-radio-group v-model="range" size="small" @change="render">
          <el-radio-button value="1m">近1月</el-radio-button>
          <el-radio-button value="3m">近3月</el-radio-button>
          <el-radio-button value="6m">近6月</el-radio-button>
          <el-radio-button value="1y">近1年</el-radio-button>
          <el-radio-button value="2y">近2年</el-radio-button>
          <el-radio-button value="3y">近3年</el-radio-button>
          <el-radio-button value="5y">近5年</el-radio-button>
          <el-radio-button value="all">全部</el-radio-button>
        </el-radio-group>
      </div>
    </div>
    <div ref="el" style="height:300px;margin-top:8px"></div>
  </el-card>`
};

/* ---------------- 投资占比（按类型统计当前市值） ---------------- */
const InvestPieCard = {
  setup() {
    const el = ref(null);
    let chart = null;
    const render = async () => {
      if (!chart) return;
      const mob = window.innerWidth <= 768;
      const list = await apiGet('/investment/list').catch(() => []);
      const invs = Array.isArray(list) ? list : (list ? list.list || [] : []);
      const groups = {};
      invs.forEach(x => {
        const c = x.type || '其他';
        groups[c] = (groups[c] || 0) + (Number(x.currentValue) || 0);
      });
      // 清仓（市值为 0）的标的不进占比：零值切片会在饼图/图例残留占位
      const data = Object.keys(groups)
        .map(k => ({ name: k, value: Math.round(groups[k] * 100) / 100 }))
        .filter(d => d.value > 0);
      chart.setOption({
        textStyle: { fontFamily: '-apple-system, "PingFang SC", "Helvetica Neue", sans-serif' },
        title: { show: false },
        color: ['#007aff', '#34c759', '#ff9500', '#ff3b30', '#af52de', '#5ac8fa'],
        tooltip: {
          trigger: 'item',
          textStyle: { fontSize: mob ? 11 : 13 },
          formatter: p => p.name + '<br/>¥ ' + Number(p.value).toLocaleString('zh-CN', { minimumFractionDigits: 2 }) + '（' + p.percent + '%）'
        },
        // 移动端：图例放底部横向，饼居中放大；桌面端：图例右侧纵向
        legend: mob
          ? { bottom: 0, left: 'center', icon: 'circle', itemWidth: 8, itemHeight: 8, itemGap: 10, textStyle: { color: '#6e6e73', fontSize: 10 } }
          : { orient: 'vertical', right: 4, top: 'middle', icon: 'circle', itemWidth: 10, itemHeight: 10, itemGap: 8, textStyle: { color: '#6e6e73', fontSize: 12 } },
        series: [{
          type: 'pie',
          radius: mob ? ['42%', '64%'] : ['48%', '70%'],
          center: mob ? ['50%', '42%'] : ['36%', '50%'],
          avoidLabelOverlap: true,
          itemStyle: { borderColor: '#fff', borderWidth: 2, borderRadius: 6 },
          // 卡片较窄，静态百分比标签放在外侧会被裁切；改为悬停时展示（图例与悬浮提示已含占比）
          label: { show: false },
          emphasis: { scaleSize: 6, label: { show: true, formatter: '{d}%', color: '#1d1d1f', fontSize: 14, fontWeight: 'bold' } },
          data
        }]
      }, true);
    };
    const resize = () => chart && chart.resize();
    onMounted(() => {
      chart = echarts.init(el.value);
      render();
      window.addEventListener('resize', resize);
      window.addEventListener('pm-data-changed', render);
    });
    onBeforeUnmount(() => {
      window.removeEventListener('resize', resize);
      window.removeEventListener('pm-data-changed', render);
      chart && chart.dispose();
    });
    return { el };
  },
  template: `<el-card class="chart-card" style="width:300px;flex-shrink:0;margin-bottom:0">
    <template #header><b style="color:#1d1d1f;font-size:15px">投资占比</b></template>

  </el-card>`
};

/* ---------------- 资产走势：总资产（上）与细分资产（下）两张同尺寸折线图 ---------------- */
const makeAssetTrendChart = (totalOnly) => ({
  setup() {
    const el = ref(null);
    let chart = null;
    const now = new Date();
    const ymOf = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    const ds = new Date(now.getFullYear(), now.getMonth() - 11, 1);
    const range = ref([ymOf(ds), ymOf(now)]);
    const palette = ['#007aff', '#34c759', '#ff9500', '#af52de', '#5ac8fa', '#ff3b30', '#8e8e93'];
    const onPill = ({ start, end, preset }) => {
      if (preset === 'all') { range.value = ['2015-01', ymOf(new Date())]; return; }
      range.value = [start.slice(0, 7), end.slice(0, 7)];
    };
    const render = async () => {
      if (!chart) return;
      const mob = window.innerWidth <= 768;
      // 区间支持月（YYYY-MM）与日（YYYY-MM-DD）：起始月首日 ~ 结束月末日
      const r1 = range.value[1];
      const start = range.value[0].slice(0, 7) + '-01';
      const [ey, em] = r1.slice(0, 7).split('-').map(Number);
      const endDate = new Date(ey, em, 0);
      const end = endDate.getFullYear() + '-' + String(endDate.getMonth() + 1).padStart(2, '0') + '-' + String(endDate.getDate()).padStart(2, '0');
      const data = await apiGet('/asset/trend/daily', { start, end }).catch(() => null);
      if (!data || !data.days) return;
      const days = data.days;
      let series;
      if (totalOnly) {
        series = [{
          name: '总资产', type: 'line', smooth: false, symbol: 'circle', symbolSize: 6,
          data: data.total || [],
          lineStyle: { width: 3, color: '#1d1d1f' },
          itemStyle: { color: '#1d1d1f', borderColor: '#fff', borderWidth: 2 },
          areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: 'rgba(29,29,31,0.10)' }, { offset: 1, color: 'rgba(29,29,31,0.01)' }]) }
        }];
      } else {
        series = (data.assets || []).map((a, i) => ({
          name: a.name, type: 'line', smooth: false, symbol: 'none',
          data: a.values,
          lineStyle: { width: 1.5, color: palette[i % palette.length] },
          itemStyle: { color: palette[i % palette.length] }
        }));
      }
      chart.setOption({
        textStyle: { fontFamily: '-apple-system, "PingFang SC", "Helvetica Neue", sans-serif' },
        tooltip: {
          trigger: 'axis',
          textStyle: { fontSize: mob ? 11 : 13 },
          valueFormatter: v => v == null ? '—' : '¥ ' + Number(v).toLocaleString('zh-CN', { minimumFractionDigits: 2 })
        },
        legend: totalOnly
          ? { show: false }
          : mob
            ? { type: 'scroll', top: 0, right: 4, icon: 'roundRect', itemWidth: 10, itemHeight: 3, textStyle: { fontSize: 10 } }
            : { type: 'scroll', top: 0, right: 8, icon: 'roundRect', itemWidth: 14, itemHeight: 4, textStyle: { fontSize: 12 } },
        grid: mob ? { left: 4, right: 4, top: totalOnly ? 16 : 30, bottom: 4, containLabel: true } : { left: 10, right: 18, top: 36, bottom: 6, containLabel: true },
        xAxis: {
          type: 'category', boundaryGap: false, data: days.map(d => d.slice(2)),
          axisLine: { lineStyle: { color: 'rgba(0,0,0,0.12)' } },
          axisTick: { show: false }, axisLabel: { color: '#86868b', fontSize: mob ? 10 : 12 }
        },
        yAxis: {
          type: 'value', position: mob ? 'right' : 'left',
          splitLine: { lineStyle: { color: 'rgba(0,0,0,0.06)' } },
          axisLabel: { color: '#86868b', fontSize: mob ? 10 : 12, formatter: v => v >= 10000 ? (v / 10000) + '万' : v }
        },
        series: series
      }, true);
    };
    const resize = () => { if (!chart) return; chart.resize(); render(); };
    watch(range, render);
    onMounted(() => {
      chart = echarts.init(el.value);
      render();
      window.addEventListener('resize', resize);
      window.addEventListener('pm-data-changed', render);
    });
    onBeforeUnmount(() => {
      window.removeEventListener('resize', resize);
      window.removeEventListener('pm-data-changed', render);
      chart && chart.dispose();
    });
    return { el, range };
  },
  template: '<el-card class="chart-card" style="width:100%;margin-bottom:0">'
    + '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:8px">'
    + '<b style="color:#1d1d1f;font-size:15px">' + (totalOnly ? '总资产走势' : '细分资产走势') + '</b>'
    + '<el-date-picker v-model="range" type="monthrange" value-format="YYYY-MM" :clearable="false" class="desk-range" '
    + 'size="small" style="width:230px" range-separator="至" start-placeholder="开始月" end-placeholder="结束月" />'
    + '<RangePills class="mob-range" :start="range[0]" :end="range[1]" @change="onPill" />'
    + '</div>'
    + '<div ref="el" class="chart-canvas" style="flex:1;min-height:0"></div>'
    + '</el-card>'
});
const AssetTotalTrendChart = makeAssetTrendChart(true);
const AssetDetailTrendChart = makeAssetTrendChart(false);

/* ---------------- 登录页（POST /api/auth/login、POST /api/auth/register） ---------------- */
const LoginPage = {
  setup() {
    const isLogin = ref(true);
    const loading = ref(false);
    const form = ref({ username: '', password: '', nickname: '' });
    const remember = ref(true);
    const handleSubmit = async () => {
      if (!form.value.username.trim()) { ElMessage.warning('请输入用户名'); return; }
      if (!form.value.password) { ElMessage.warning('请输入密码'); return; }
      loading.value = true;
      try {
        // 注册功能已暂时下线（UI 入口已隐藏），此处强制走登录，防直达残留状态
        isLogin.value = true;
        if (isLogin.value) {
          const d = await apiPost('/auth/login', { username: form.value.username.trim(), password: form.value.password });
          store.set('token', d.token || '', remember.value);
          store.set('nickname', d.nickname || form.value.username.trim(), remember.value);
          window.dispatchEvent(new Event('pm-auth-changed'));
          ElMessage.success('登录成功');
        } else {
          await apiPost('/auth/register', {
            username: form.value.username.trim(),
            password: form.value.password,
            nickname: form.value.nickname || form.value.username.trim()
          });
          ElMessage.success('注册成功，请登录');
          isLogin.value = true;
        }
      } catch (e) { /* 错误信息已由接口层提示 */ }
      finally { loading.value = false; }
    };
    return { isLogin, loading, form, remember, handleSubmit };
  },
  template: `<div class="login-box">
    <div class="login-logo">个人管理系统</div>
    <div class="login-sub">{{ isLogin ? '登录你的账号' : '注册一个新账号' }}</div>
    <el-form @submit.prevent>
      <el-form-item>
        <el-input v-model="form.username" placeholder="用户名" size="large" :prefix-icon="'User'" @keyup.enter="handleSubmit" />
      </el-form-item>
      <el-form-item v-if="!isLogin">
        <el-input v-model="form.nickname" placeholder="昵称（选填）" size="large" :prefix-icon="'Postcard'" @keyup.enter="handleSubmit" />
      </el-form-item>
      <el-form-item>
        <el-input v-model="form.password" type="password" placeholder="密码" size="large" show-password :prefix-icon="'Lock'" @keyup.enter="handleSubmit" />
      </el-form-item>
      <el-form-item v-if="isLogin" style="margin-bottom:8px">
        <el-checkbox v-model="remember">30天内保持登录</el-checkbox>
      </el-form-item>
      <el-button type="primary" size="large" style="width:100%;letter-spacing:4px" :loading="loading" @click="handleSubmit">{{ isLogin ? '登 录' : '注 册' }}</el-button>
      <!-- 注册入口已暂时下线，保留代码便于恢复：
      <div class="login-toggle">
        <span v-if="isLogin">还没有账号？<a @click="isLogin = false">立即注册</a></span>
        <span v-else>已有账号？<a @click="isLogin = true">返回登录</a></span>
      </div>
      -->
    </el-form>
  </div>`
};

/* ---------------- 移动端通用：记一笔收入/支出弹窗（财务首页与收支详情页共用） ---------------- */
const MobileMoneyDialog = {
  props: { type: { type: String, default: 'income' }, visible: Boolean },
  emits: ['update:visible', 'saved'],
  setup(props, { emit }) {
    const form = ref({ amount: null, category: '', recordDate: todayStr(), assetId: null, remark: '' });
    const cashAssets = ref([]);
    const loadCashAssets = async () => {
      const data = await apiGet('/asset/list').catch(() => []);
      const arr = Array.isArray(data) ? data : (data ? data.list || [] : []);
      cashAssets.value = arr.filter(a => a.category === '现金' || a.category === '银行卡');
    };
    watch(() => props.visible, v => {
      if (v) { form.value = { amount: null, category: props.type === 'income' ? '工资' : '餐饮', recordDate: todayStr(), assetId: null, remark: '' }; loadCashAssets(); }
    });
    const cats = computed(() => props.type === 'income' ? incomeCategories : expenseCategories.filter(c => c !== '投资'));
    const innerVisible = computed({ get: () => props.visible, set: v => emit('update:visible', v) });
    const save = async () => {
      const f = form.value;
      if (!(Number(f.amount) > 0)) { ElMessage.warning('请填写正确的金额'); return; }
      if (!f.assetId) { ElMessage.warning('请选择资产'); return; }
      try {
        await apiPost('/' + props.type, { amount: Number(f.amount), category: f.category, recordDate: f.recordDate, assetId: f.assetId, remark: f.remark || '' });
        ElMessage.success(props.type === 'income' ? '已记收入' : '已记支出');
        emit('update:visible', false);
        emit('saved');
      } catch (e) { /* 错误信息已由拦截层提示 */ }
    };
    return { form, cashAssets, cats, innerVisible, save, fmt };
  },
  template: `<el-dialog v-model="innerVisible" :title="type === 'income' ? '记一笔收入' : '记一笔支出'" width="92%" style="max-width:420px">
    <el-form label-width="64px">
      <el-form-item label="金额"><el-input-number v-model="form.amount" :min="0" :precision="2" style="width:100%" controls-position="right" /></el-form-item>
      <el-form-item label="分类">
        <el-select v-model="form.category" style="width:100%"><el-option v-for="c in cats" :key="c" :label="c" :value="c" /></el-select>
      </el-form-item>
      <el-form-item label="日期"><el-date-picker v-model="form.recordDate" type="date" value-format="YYYY-MM-DD" style="width:100%" /></el-form-item>
      <el-form-item label="资产">
        <el-select v-model="form.assetId" placeholder="选择现金/银行卡资产" style="width:100%">
          <el-option v-for="a in cashAssets" :key="a.id" :label="a.name + '（¥ ' + fmt(a.value) + '）'" :value="a.id" />
        </el-select>
      </el-form-item>
      <el-form-item label="备注"><el-input v-model="form.remark" placeholder="选填" /></el-form-item>
    </el-form>
    <template #footer>
      <el-button @click="innerVisible = false">取消</el-button>
      <el-button type="primary" @click="save">保存</el-button>
    </template>
  </el-dialog>`
};
