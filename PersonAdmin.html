  </div>`
};

/* ---------------- 移动端：月份滑轮（年/月两列，滚动选择，无 input 不缩放） ---------------- */
const MonthWheel = {
  props: { modelValue: String },
  emits: ['confirm', 'cancel'],
  setup(props, { emit }) {
    const H = 36;
    const curYear = new Date().getFullYear();
    const years = []; for (let y = curYear - 12; y <= curYear + 3; y++) years.push(y);
    const months12 = Array.from({ length: 12 }, (_, i) => i + 1);
    const p = (props.modelValue || monthPrefix).split('-').map(Number);
    const sel = reactive({ y: p[0], m: p[1] || 1 });
    const root = ref(null);
    const onWheel = k => ev => {
      const el = ev.target;
      clearTimeout(el._wt);
      el._wt = setTimeout(() => {
        const list = k === 'y' ? years : months12;
        let idx = Math.round(el.scrollTop / H);
        idx = Math.max(0, Math.min(idx, list.length - 1));
        if (Math.abs(el.scrollTop - idx * H) > 1) el.scrollTop = idx * H;
        const v = list[idx];
        if (sel[k] !== v) sel[k] = v;
      }, 90);
    };
    onMounted(() => {
      const set = (k, idx) => { const el = root.value.querySelector('[data-wheel="' + k + '"]'); if (el) el.scrollTop = Math.max(0, idx) * H; };
      set('y', years.indexOf(sel.y)); set('m', sel.m - 1);
    });
    const text = computed(() => sel.y + '年' + sel.m + '月');
    const pad = n => String(n).padStart(2, '0');
    const ok = () => emit('confirm', sel.y + '-' + pad(sel.m));
    const cancel = () => emit('cancel');
    return { root, years, months12, onWheel, text, ok, cancel };
  },
  template: `<div class="wr-mask" ref="root" @click="cancel">
    <div class="wr-sheet" @click.stop>
      <div class="wr-head"><span class="wr-cancel" @click="cancel">取消</span><b>选择月份</b><span class="wr-ok" @click="ok">确定</span></div>
      <div class="wr-title">{{ text }}</div>
      <div class="wr-group">
        <span class="wr-label">月份</span>
        <div class="wr-wheels">
          <div class="wr-wheel" data-wheel="y" @scroll="onWheel('y')"><div class="wr-item" v-for="y in years" :key="y">{{ y }}年</div></div>
          <div class="wr-wheel" data-wheel="m" @scroll="onWheel('m')"><div class="wr-item" v-for="m in months12" :key="m">{{ m }}月</div></div>
        </div>
      </div>
    </div>
  </div>`
};

/* ---------------- 移动端：收支趋势图（样式与投资总市值/盈亏走势一致） ---------------- */
const MobileIeChart = {
  setup() {
    const el = ref(null);
    let chart = null;
    const now = new Date();
    const ymOf = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    const range = ref([ymOf(new Date(now.getFullYear(), now.getMonth() - 5, 1)), ymOf(now)]);
    const onPill = ({ start, end, preset }) => {
      if (preset === 'all') { range.value = ['2015-01', ymOf(new Date())]; return; }
      range.value = [start.slice(0, 7), end.slice(0, 7)];
    };
    const render = async () => {
      if (!chart) return;
      const data = await apiGet('/stats/income-expense', { startMonth: range.value[0], endMonth: range.value[1] }).catch(() => null);
      if (!data) return;
      chart.setOption({
        textStyle: { fontFamily: '-apple-system, "PingFang SC", "Helvetica Neue", sans-serif' },
        tooltip: { trigger: 'axis', textStyle: { fontSize: 11 }, valueFormatter: v => '¥ ' + Number(v).toLocaleString('zh-CN', { minimumFractionDigits: 2 }) },
        legend: { data: ['收入', '支出'], top: 4, right: 4, icon: 'roundRect', itemWidth: 10, itemHeight: 3, textStyle: { fontSize: 10, color: '#6e6e73' } },
        grid: { left: 4, right: 4, top: 30, bottom: 4, containLabel: true },
        xAxis: {
          type: 'category', data: data.map(d => d.month.slice(2)),
          axisLine: { lineStyle: { color: 'rgba(0,0,0,0.12)' } },
          axisTick: { show: false }, axisLabel: { color: '#86868b', fontSize: 10 }
        },
        yAxis: {
          type: 'value', position: 'right',
          splitLine: { lineStyle: { color: 'rgba(0,0,0,0.06)' } },
          axisLabel: { color: '#86868b', fontSize: 10, formatter: v => Math.abs(v) >= 10000 ? Math.round(v / 10000) + '万' : v }
        },
        series: [
          { name: '收入', type: 'line', smooth: false, symbol: 'none', data: data.map(d => d.income),
            lineStyle: { width: 2, color: '#ff3b30' }, itemStyle: { color: '#ff3b30' },
            areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: 'rgba(255,59,48,0.18)' }, { offset: 1, color: 'rgba(255,59,48,0.02)' }]) } },
          { name: '支出', type: 'line', smooth: false, symbol: 'none', data: data.map(d => d.expense),
            lineStyle: { width: 2, color: '#34c759' }, itemStyle: { color: '#34c759' },
            areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: 'rgba(52,199,89,0.14)' }, { offset: 1, color: 'rgba(52,199,89,0.02)' }]) } }
        ]
      }, true);
    };
    const resize = () => { if (!chart) return; chart.resize(); render(); };
    watch(range, render);
    onMounted(() => {
      chart = echarts.init(el.value);
      render();
      window.addEventListener('resize', resize);
      window.addEventListener('pm-data-changed', render);
    });
    onBeforeUnmount(() => {
      window.removeEventListener('resize', resize);
      window.removeEventListener('pm-data-changed', render);
      chart && chart.dispose();
    });
    return { el, range, onPill };
  },
  template: `<div class="m-sec">
    <div class="m-sec-head">
      <div class="m-sec-icon" style="background:rgba(245,108,108,.12);color:#f56c6c"><el-icon :size="16"><TrendCharts /></el-icon></div>
      <span class="m-sec-title">收支趋势</span>
    </div>
    <RangePills :start="range[0]" :end="range[1]" @change="onPill" />
    <div ref="el" style="height:200px;margin-top:4px"></div>
  </div>`
};

/* ---------------- 移动端：收支详情（趋势图 + 收入/支出列表切换 + 记账 + 月份滚动选择） ---------------- */
const MobileMonthPage = {
  setup() {
    const tab = ref('income');
    const month = ref(monthPrefix);
    const list = ref([]);
    const loading = ref(false);
    const monthWheelVisible = ref(false);
    const incomeVisible = ref(false);
    const expenseVisible = ref(false);
    const load = async () => {
      loading.value = true;
      try {
        const data = await apiGet('/' + tab.value + '/list', { pageNum: 1, pageSize: 1000, month: month.value }).catch(() => []);
        list.value = Array.isArray(data) ? data : (data ? data.list || [] : []);
      } finally { loading.value = false; }
    };
    watch([tab, month], load);
    onMounted(() => { load(); window.addEventListener('pm-data-changed', load); });
    onBeforeUnmount(() => window.removeEventListener('pm-data-changed', load));
    const total = computed(() => list.value.reduce((s, x) => s + (Number(x.amount) || 0), 0));
    const onMonth = v => { monthWheelVisible.value = false; month.value = v; };
    const onSaved = () => window.dispatchEvent(new Event('pm-data-changed'));
    const monthText = computed(() => { const p = month.value.split('-'); return Number(p[0]) + '年' + Number(p[1]) + '月'; });
    return { tab, month, list, loading, total, monthText,
             monthWheelVisible, incomeVisible, expenseVisible, onMonth, onSaved, fmt };
  },
  template: `<div class="m-wrap">
    <MobileIeChart />
    <div class="m-sec">
      <div class="m-sec-head">
        <div class="m-sec-icon" style="background:rgba(245,108,108,.12);color:#f56c6c"><el-icon :size="16"><Wallet /></el-icon></div>
        <div class="m-month-tabs">
          <span class="m-month-tab" :class="{ on: tab === 'income' }" @click="tab = 'income'">收入</span>
          <span class="m-month-tab" :class="{ on: tab === 'expense' }" @click="tab = 'expense'">支出</span>
        </div>
        <span class="m-sec-more" @click="monthWheelVisible = true">{{ monthText }}<el-icon :size="12"><ArrowDown /></el-icon></span>
      </div>
      <div class="m-line" v-for="r in list" :key="r.id">
        <div class="m-line-main">
          <div class="m-line-name">{{ r.category }}</div>
          <div class="m-line-sub">{{ r.recordDate }}<template v-if="r.assetName"> · {{ r.assetName }}</template><template v-if="r.remark"> · {{ r.remark }}</template></div>
        </div>
        <b :class="tab === 'income' ? 'green' : 'red'" style="font-variant-numeric:tabular-nums">{{ (tab === 'income' ? '+' : '-') + fmt(r.amount) }}</b>
      </div>
      <div v-if="!loading && !list.length" class="m-empty">该月暂无{{ tab === 'income' ? '收入' : '支出' }}记录</div>
      <div class="m-month-total">合计：<b :class="tab === 'income' ? 'green' : 'red'">{{ (tab === 'income' ? '+' : '-') + fmt(total) }}</b></div>
      <div style="display:flex;gap:10px;padding:12px 0 8px">
        <el-button style="flex:1" :disabled="tab !== 'income'" @click="incomeVisible = true">记一笔收入</el-button>
        <el-button style="flex:1" type="danger" plain :disabled="tab !== 'expense'" @click="expenseVisible = true">记一笔支出</el-button>
      </div>
    </div>
    <MonthWheel v-if="monthWheelVisible" :model-value="month" @confirm="onMonth" @cancel="monthWheelVisible = false" />
    <MobileMoneyDialog type="income" v-model:visible="incomeVisible" @saved="onSaved" />
    <MobileMoneyDialog type="expense" v-model:visible="expenseVisible" @saved="onSaved" />
  </div>`
};

/* ---------------- 路由 + 根组件 ---------------- */
const routes = {
  '/dashboard':  { comp: DashboardPage, title: '主页' },
  '/m/finance':  { comp: MobileFinancePage, title: '财务' },
  '/m/month-detail': { comp: MobileMonthPage, title: '收支详情' },
  '/m/health':   { comp: MobileHealthPage,  title: '健康' },
  '/income':     { comp: IncomePage,    title: '收入' },
  '/expense':    { comp: ExpensePage,   title: '支出' },
  '/investment': { comp: InvestmentPage,title: '投资' },
  '/assets':     { comp: AssetPage,     title: '资产' },
  '/fx':         { comp: FxPage,        title: '汇率' },
  '/health/weight':   { comp: WeightPage,   title: '体重管理' },
};

const App = {
  setup() {
    const route = ref(location.hash || '#/dashboard');
    const isMobile = () => window.innerWidth <= 768;
    window.addEventListener('hashchange', () => {
      let h = location.hash || '#/dashboard';
      if (!h || h === '#/') h = '#/dashboard';
      // 移动端主页落位到财务总览（桌面端仍是 dashboard）
      if (isMobile() && h === '#/dashboard') { location.hash = '#/m/finance'; return; }
      route.value = h;
    });
    if (!location.hash || location.hash === '#/') location.hash = isMobile() ? '#/m/finance' : '#/dashboard';
    const currentComp = computed(() => (routes[route.value.replace('#', '')] || routes['/dashboard']).comp);
    const pageTitle = computed(() => (routes[route.value.replace('#', '')] || routes['/dashboard']).title);
    const go = index => { location.hash = index; };
    const authed = ref(!!store.get('token'));
    const nickname = ref(store.get('nickname'));
    window.addEventListener('pm-auth-changed', () => {
      authed.value = !!store.get('token');
      nickname.value = store.get('nickname');
    });
    const logout = () => {
      store.clear('token');
      store.clear('nickname');
      window.dispatchEvent(new Event('pm-auth-changed'));
    };
    return { route, currentComp, pageTitle, go, authed, nickname, logout };
  },
  template: `<div v-if="!authed" class="login-wrap"><LoginPage /></div>
  <div v-else class="layout">
    <aside class="aside">
      <el-menu :default-active="route" @select="go">
        <el-menu-item index="#/dashboard"><el-icon><Odometer /></el-icon><span>主页</span></el-menu-item>
        <el-sub-menu index="finance">
          <template #title><el-icon><Wallet /></el-icon><span>财务</span></template>
          <el-menu-item index="#/income">收入</el-menu-item>
          <el-menu-item index="#/expense">支出</el-menu-item>
          <el-menu-item index="#/investment">投资</el-menu-item>
          <el-menu-item index="#/assets">资产</el-menu-item>
          <el-menu-item index="#/fx">汇率</el-menu-item>
        </el-sub-menu>
        <el-sub-menu index="health">
          <template #title><el-icon><FirstAidKit /></el-icon><span>健康</span></template>
          <el-menu-item index="#/health/weight">体重管理</el-menu-item>
        </el-sub-menu>
      </el-menu>
    </aside>
    <div class="main">
      <header class="header">
        <span>{{ pageTitle }}</span>
        <div style="flex:1"></div>
        <span class="header-nickname" style="color:#6e6e73;font-size:13px;margin-right:14px">{{ nickname }}</span>
        <el-button text size="small" @click="logout">退出登录</el-button>
      </header>
      <main class="content"><component :is="currentComp" /></main>
    </div>
    <nav class="m-tabbar">
      <div class="m-tab" :class="{ active: route === '#/m/finance' }" @click="go('#/m/finance')">
        <el-icon :size="20"><Wallet /></el-icon><span>财务</span>
      </div>
      <div class="m-tab" :class="{ active: route === '#/m/health' || route === '#/health/weight' }" @click="go('#/m/health')">
        <el-icon :size="20"><FirstAidKit /></el-icon><span>健康</span>
      </div>
    </nav>
  </div>`
};

  navigator.serviceWorker.register('sw.js').catch(() => {});
